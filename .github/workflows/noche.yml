name: noche
# Lo lanza Claude tras escribir overlay.json (workflow_dispatch). Si Claude no lo lanza, corre solo a las 02:30 Madrid con overlay vacío.
on:
  workflow_dispatch:
    inputs:
      forzar: { description: "Ejecutar aunque ya se haya hecho hoy", type: boolean, default: false }
  schedule:
    - cron: "30 1 * * *"   # 02:30 Madrid (invierno), respaldo
concurrency: { group: noche, cancel-in-progress: false }
permissions: { contents: write, issues: write }
jobs:
  noche:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env: { GH_TOKEN: "${{ github.token }}", TZ: Europe/Madrid }
    steps:
      - uses: actions/checkout@v4
      - name: ¿Ya hecha hoy?
        id: hecha
        run: |
          if [ "$(jq -r '.fecha // ""' estado/publico/ejecucion.json 2>/dev/null)" = "$(date +%F)" ] && [ "${{ inputs.forzar }}" != "true" ]; then echo "si=1" >> $GITHUB_OUTPUT; echo "Ya ejecutada hoy"; fi
      - uses: actions/setup-python@v5
        if: steps.hecha.outputs.si != '1'
        with: { python-version: "3.12", cache: pip, cache-dependency-path: codigo/requirements.txt }
      - uses: actions/cache@v4
        if: steps.hecha.outputs.si != '1'
        with: { path: codigo/data/raw, key: "raw-${{ github.run_id }}", restore-keys: "raw-" }
      - name: Descargar datos
        if: steps.hecha.outputs.si != '1'
        working-directory: codigo
        run: pip install -q -r requirements.txt && pip freeze | grep -iE '^(lightgbm|pandas|numpy|scipy|pyarrow)==' > ../estado/publico/versiones.txt && python descargar.py
      - name: Overlay del día
        if: steps.hecha.outputs.si != '1'
        run: |
          if [ "$(git log -1 --format=%cd --date=format-local:%F -- estado/overlay.json)" != "$(date +%F)" ]; then
            echo "Overlay no es de hoy: se usa vacío"; echo '[]' > estado/overlay.json; fi
          cat estado/overlay.json
      - name: paper.py
        if: steps.hecha.outputs.si != '1'
        working-directory: codigo
        run: |
          python paper.py ../estado/state.json ../estado/overlay.json out > salida.json
          python publicar.py out salida.json
      - name: Commit
        if: steps.hecha.outputs.si != '1'
        run: |
          git config user.name "vesuvio-bot"; git config user.email "actions@github.com"
          git add estado/ && git commit -m "noche $(date +%F): simulación (Actions)"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done; exit 1
      - name: Avisar del fallo
        if: failure()
        run: |
          gh label create fallo --color B60205 2>/dev/null || true
          gh issue create --title "🔴 Fallo workflow noche $(date +%F)" --label fallo --body "Logs: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
