name: datos
on:
  schedule:
    - cron: "30 20 * * *"   # 21:30 Madrid (invierno)
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  descargar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Descargar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f codigo/data.py ]; then echo "codigo/data.py aún no migrado; nada que hacer"; exit 0; fi
          pip install -q -r codigo/requirements.txt
          cd codigo && python data.py --force || { gh issue create --title "🔴 Fallo datos $(TZ=Europe/Madrid date +%F)" --label fallo --body "data.py falló en Actions. Ver logs: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; exit 1; }
      - name: Commit
        run: |
          git config user.name "vesuvio-bot"; git config user.email "actions@github.com"
          git add datos/ && git commit -m "datos $(TZ=Europe/Madrid date +%F)" && git push || echo "sin cambios"
