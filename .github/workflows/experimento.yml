name: experimento
on:
  workflow_dispatch:
    inputs:
      script: { description: "script de codigo/ (sin .py)", required: true }
      salida: { description: "carpeta en experimentos/", required: true }
concurrency: { group: noche, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  exp:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env: { TZ: Europe/Madrid }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: codigo/requirements.txt }
      - uses: actions/cache/restore@v4
        id: cache
        with: { path: codigo/data/raw, key: "raw-none", restore-keys: "raw-" }
      - name: Ejecutar
        working-directory: codigo
        run: |
          pip install -q -r requirements.txt
          ls data/raw/*.parquet >/dev/null 2>&1 || python descargar.py
          set -o pipefail; python "${{ inputs.script }}.py" "../experimentos/${{ inputs.salida }}" | tee "../experimentos_log.txt"
          mv ../experimentos_log.txt "../experimentos/${{ inputs.salida }}/log.txt"
      - name: Commit
        run: |
          git config user.name "vesuvio-bot"; git config user.email "actions@github.com"
          git add experimentos/ && git commit -m "experimento ${{ inputs.salida }}"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done; exit 1
